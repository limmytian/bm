name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build (linux-${{ matrix.arch_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch_name: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch_name: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          VERSION="${RAW_TAG#v}"
          ARCHIVE_NAME="bm-${VERSION}-linux-${{ matrix.arch_name }}.tar.gz"

          cd "target/${{ matrix.target }}/release"
          tar -czf "../../../${ARCHIVE_NAME}" bm
          cd ../../..

          shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          gh release view "$RAW_TAG" || gh release create "$RAW_TAG" --title "$RAW_TAG" --notes "Release $RAW_TAG"
          gh release upload "$RAW_TAG" "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256" --clobber

  build-macos:
    name: Build (darwin arm64 + x64)
    # One runner builds both Apple targets (arm64 native, x64 cross-compiled
    # with the Apple toolchain) — halves macOS runner demand in the free
    # tier, where queue cancellations under capacity pressure are common.
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build, package and upload both architectures
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          VERSION="${RAW_TAG#v}"

          gh release view "$RAW_TAG" >/dev/null 2>&1 || gh release create "$RAW_TAG" --title "$RAW_TAG" --notes "Release $RAW_TAG"

          for pair in "aarch64-apple-darwin arm64" "x86_64-apple-darwin x64"; do
            set -- $pair
            TARGET="$1"; ARCH="$2"
            cargo build --release --target "$TARGET"
            ARCHIVE_NAME="bm-${VERSION}-darwin-${ARCH}.tar.gz"
            tar -czf "$ARCHIVE_NAME" -C "target/${TARGET}/release" bm
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            gh release upload "$RAW_TAG" "$ARCHIVE_NAME" "$ARCHIVE_NAME.sha256" --clobber
            rm -f "$ARCHIVE_NAME" "$ARCHIVE_NAME.sha256"
          done

  update-tap:
    name: Update homebrew-tap formula
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag & version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "$RAW_TAG" = "main" ]; then
            RAW_TAG="${{ inputs.tag }}"
          fi
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir checksums
          gh release download "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.sha256' --dir checksums

      - name: Render formula from template
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          for a in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            f="checksums/bm-${V}-${a}.tar.gz.sha256"
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty checksum file: $f"
              exit 1
            fi
          done
          sha() { awk '{print $1}' "checksums/bm-${V}-$1.tar.gz.sha256"; }
          sed -e "s/__VERSION__/${V}/g" \
              -e "s/__SHA_DARWIN_ARM64__/$(sha darwin-arm64)/" \
              -e "s/__SHA_DARWIN_X64__/$(sha darwin-x64)/" \
              -e "s/__SHA_LINUX_X64__/$(sha linux-x64)/" \
              -e "s/__SHA_LINUX_ARM64__/$(sha linux-arm64)/" \
              .github/homebrew/bm.rb.template > bm.rb
          if command -v ruby >/dev/null; then ruby -c bm.rb; else echo "ruby not available, skipping syntax check"; fi

      - name: Push formula update to tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN secret is not set on this repository; add a PAT with repo scope for limmytian/homebrew-tap."
            exit 1
          fi
          git config --global user.name "bm-release-bot"
          git config --global user.email "bm-release-bot@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/limmytian/homebrew-tap.git" tap
          cp bm.rb tap/Formula/bm.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date, nothing to push."
          else
            git add Formula/bm.rb
            git commit -m "chore(bm): bump formula to ${{ steps.ver.outputs.version }}"
            git push
            echo "Tap formula updated to ${{ steps.ver.outputs.version }}."
          fi
