[package]
name = "bm"
version = "0.0.2"
edition = "2021"
description = "Browser profile and session sandbox manager for Chrome and Edge"
authors = ["limmytian <limmytian@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/limmytian/bm"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
colored = "3.0"

[dev-dependencies]
tempfile = "3.17"

