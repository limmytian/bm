[package]
name = "bm"
version = "0.0.10"
edition = "2021"
description = "Browser profile and session sandbox manager for Chrome, Edge, Brave, and Chromium"
authors = ["limmytian <limmytian@gmail.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/limmytian/bm"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
colored = "3.0"
ureq = { version = "2", features = ["socks-proxy"] }
inquire = "0.7"
clap_complete = "4.5"
tar = "0.4"
zstd = "0.14"
age = "0.12.1"
clap_mangen = "0.3.3"
tungstenite = "0.30.0"
rmcp = { version = "3.8.0", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "io-std", "time", "net", "macros", "signal"] }
tokio-util = "0.7"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.33", features = ["bundled"] }
tempfile = "3.17"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.12"
sha1 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"

[target.'cfg(windows)'.dependencies]
junction = "1.2"
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Threading", "Win32_Foundation", "Win32_System_ProcessStatus"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.17"
